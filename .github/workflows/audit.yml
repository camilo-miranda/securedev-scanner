name: SecureDev AI - Static Audit

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: "Repositorio público HTTPS (github.com/owner/repo)"
        required: false
        type: string
      audit_id:
        description: "ID de auditoría de SecureDev AI"
        required: true
        type: string
      ref:
        description: "Rama o tag"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: securedev-audit-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout scanner (trusted code)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner dependencies
        run: pip install -r requirements.txt

      - name: Install Semgrep
        run: pip install semgrep
        
      
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.76.2"
        run: |
          set -euo pipefail

          FILE="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          BASE_URL="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"

          echo "Descargando Trivy..."
          curl -fL --retry 3 \
            "${BASE_URL}/${FILE}" \
            -o "/tmp/${FILE}"

          echo "Descargando checksums..."
          curl -fL --retry 3 \
            "${BASE_URL}/trivy_${TRIVY_VERSION}_checksums.txt" \
            -o /tmp/trivy_checksums.txt

          echo "Verificando integridad..."
          cd /tmp

          grep -F "${FILE}" trivy_checksums.txt \
            | grep -F "  ${FILE}" \
            | sha256sum -c -

          echo "Extrayendo Trivy..."
          mkdir -p /tmp/trivy-install

          tar -xzf "/tmp/${FILE}" \
            -C /tmp/trivy-install

          echo "Instalando Trivy..."
          sudo install /tmp/trivy-install/trivy \
            /usr/local/bin/trivy

          echo "Verificando instalación..."
          trivy --version




      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Run static audit
        env:
          REPOSITORY_URL: ${{ inputs.repository_url }}
          REPOSITORY_REF: ${{ inputs.ref }}
        run: |
          python -m scanner.main \
            --repo "$REPOSITORY_URL" \
            --ref "$REPOSITORY_REF" \
            --out output



      - name: Verificar archivos generados
        if: always()
        run: |
          echo "Contenido del directorio actual:"
          ls -la

          echo "Contenido de output:"
          ls -la output/ || true

          if [ -f output/report.json ]; then
            echo "OK: report.json encontrado"
          else
            echo "ERROR: No se encontró output/report.json"
          fi
      

      - name: Publicar informe como Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securedev-report-${{ inputs.audit_id }}
          path: output/report.json
          retention-days: 7
          if-no-files-found: error
      

      - name: Enviar resultados a SecureDev AI
        env:
          SECUREDEV_API_URL: ${{ secrets.SECUREDEV_API_URL }}
          SCANNER_CALLBACK_TOKEN: ${{ secrets.SCANNER_CALLBACK_TOKEN }}
          AUDIT_ID: ${{ inputs.audit_id }}
        run: |
          if [ ! -f output/report.json ]; then
            echo "ERROR: No se encontró output/report.json"
            exit 1
          fi

          echo "Preparando resultados de auditoría..."

          jq -n \
            --slurpfile report output/report.json \
            '{status: "completed", report: $report[0]}' \
            > payload.json

          echo "Enviando informe a Cloudflare..."

          curl --fail-with-body --silent --show-error \
            --request POST \
            "${SECUREDEV_API_URL}/api/audits/${AUDIT_ID}/results" \
            --header "Authorization: Bearer ${SCANNER_CALLBACK_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @payload.json

          echo "Informe enviado correctamente."
